<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot - Rule-Based AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============================================
         HTML STRUCTURE - The chatbot interface
         ============================================ -->
    
    <!-- Main container for the entire chatbot -->
    <div class="chat-container">
        <!-- Header section with title and control buttons -->
        <div class="chat-header">
            <h1>📚 DELSU FAQ Chatbot</h1>
            <p>Ask Any Question you Need Answers to</p>
            <div class="controls">
                <!-- Button to show/hide debug information -->
                <button class="btn" onclick="toggleDebug()">Toggle Debug</button>
                <!-- Button to clear chat and start over -->
                <button class="btn" onclick="resetChat()">Reset Chat</button>
            </div>
        </div>

        <!-- Messages display area (where conversation appears) -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Pre-made example questions users can click -->
        <div class="example-questions">
            <button class="example-btn" onclick="sendExample('What courses do you offer?')">Courses</button>
            <button class="example-btn" onclick="sendExample('How do I apply for scholarship?')">Apply for scholarship</button>
            <button class="example-btn" onclick="sendExample('How long are the courses?')">Course duration</button>
            <button class="example-btn" onclick="sendExample('Who is the vice chancellor?')">Vice Chancellor</button>
            <button class="example-btn" onclick="sendExample('What are the courses in each faculty?')">Faculty courses</button>
        </div>

        <!-- Input area where users type their questions -->
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <!-- Helpful tip at the bottom -->
        <div class="info-bar">
            💡 Try rephrasing questions to see how pattern matching works! Ask variations to test the system's limitations.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
